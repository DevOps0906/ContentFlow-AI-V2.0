# Web app container. Pick env file with ENV_FILE=.env.local or .env.cloud (default .env.local; a plain .env is read first and overridden by it). Local Supabase: scripts/supabase-local.ps1.
#   docker compose up -d --build
services:
  web:
    build: .
    image: contentflow-web:local
    ports:
      # No login yet: keep it on localhost. Change the host port with WEB_PORT.
      - "127.0.0.1:${WEB_PORT:-3410}:3000"
    env_file:
      - path: .env
        required: false
      - path: ${ENV_FILE:-.env.local}
        required: false
    extra_hosts:
      - "host.docker.internal:host-gateway"
    restart: unless-stopped
    read_only: true
    tmpfs:
      - /tmp
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
