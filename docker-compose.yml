# Web app container. Pick env file with ENV_FILE=.env.local or .env.cloud (default .env.local; a plain .env is read first and overridden by it). Local Supabase: scripts/supabase-local.ps1.
#   docker compose up -d --build
services:
  web:
    build: .
    image: contentflow-web:local
    ports:
      # No login yet: keep it on localhost. Change the host port with WEB_PORT.
      - "127.0.0.1:${WEB_PORT:-3410}:3000"
      # Optional LAN access for the dev mobile app: set WEB_LAN_BIND (this PC's LAN IP) and WEB_LAN_PORT in .env.
      # Defaults keep it on localhost only.
      - "${WEB_LAN_BIND:-127.0.0.1}:${WEB_LAN_PORT:-3411}:3000"
    env_file:
      - path: .env
        required: false
      - path: ${ENV_FILE:-.env.local}
        required: false
    environment:
      # APK offered on the dashboard (app.apk + app.json). The folder may be missing.
      MOBILE_APK_DIR: /app/mobile-dist
    volumes:
      - ./mobile-dist:/app/mobile-dist:ro
    extra_hosts:
      - "host.docker.internal:host-gateway"
    restart: unless-stopped
    read_only: true
    tmpfs:
      - /tmp
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
