name: Build and commit documentation PDFs
on:
  push:
    branches: [master]
    paths:
      - 'docs/**/*.md'
      - 'scripts/build_docs_pdf.py'
      - '.github/workflows/build-docs-pdf.yml'
  workflow_dispatch:
permissions:
  contents: write
jobs:
  render-docs:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install Korean font and PDF dependencies
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y fonts-nanum
          python -m pip install --upgrade pip
          python -m pip install reportlab markdown
      - name: Build PDF documents
        run: python scripts/build_docs_pdf.py
      - name: Commit generated PDFs
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add docs/**/*.pdf
          if ! git diff --cached --quiet; then
            git commit -m "docs: generate categorized Korean PDFs"
            git push
          fi
