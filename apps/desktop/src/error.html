<!doctype html>
<html lang="ko">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>ContentFlow AI - 시작 오류</title>
    <link rel="stylesheet" href="startup.css" />
  </head>
  <body>
    <main class="card" role="alert">
      <h1>앱을 시작하지 못했습니다</h1>
      <p id="message">알 수 없는 오류입니다.</p>
      <p id="hint" class="hint"></p>
      <div class="actions">
        <button id="retry" type="button" class="primary">다시 시도</button>
        <button id="quit" type="button">종료</button>
      </div>
    </main>
    <script src="error.js"></script>
  </body>
</html>
